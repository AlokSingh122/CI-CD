name: CI/CD build and deploy

on: 
    push:
        branches:
        - main
    
jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
        - name: Setup SSH key
          run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
    
        - name: Build and deploy on EC2
          run: |
            ssh -i ~/.ssh/id_rsa ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd /tmp
            echo "Cloning repository..."
            rm -rf CI-CD || true
            git clone https://github.com/AlokSingh122/CI-CD.git
            cd CI-CD
            echo "Building Docker image natively on ARM64..."
            sudo docker build -t ${{ secrets.IMAGE_NAME }} .
            echo "Logging into DockerHub..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            echo "Pushing image to DockerHub..."
            sudo docker push ${{ secrets.IMAGE_NAME }}
            echo "Stopping existing container..."
            sudo docker stop testapp || true
            sudo docker rm testapp || true
            echo "Starting new container..."
            sudo docker run -d --name testapp -p 80:80 ${{ secrets.IMAGE_NAME }}
            echo "Waiting for container to be ready..."
            sleep 5
            echo "Container is running:"
            sudo docker ps | grep testapp
            sudo docker logout
            echo "Deployment successful!"
            EOF